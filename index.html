<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sketches from Sweden</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ---------------- THEME TOKENS ---------------- */
  .site[data-theme="light"]{
    --paper:#f3efe6; --paper-2:#ebe4d6; --paper-deep:#e6ddcb;
    --ink:#2b2823; --ink-soft:#7a7264; --ink-faint:#a59c8b;
    --line:#d8d0c0; --line-soft:#e4ddce; --accent:#9c6850;
    --art-shadow:rgba(40,30,20,.18); --ph-stroke:rgba(120,105,80,.16); --ph-fill:rgba(120,105,80,.05);
  }
  .site[data-theme="dark"]{
    --paper:#191613; --paper-2:#211d18; --paper-deep:#15120f;
    --ink:#ece4d6; --ink-soft:#a59a88; --ink-faint:#6f6555;
    --line:#352f27; --line-soft:#2a251e; --accent:#c89272;
    --art-shadow:rgba(0,0,0,.55); --ph-stroke:rgba(210,195,170,.14); --ph-fill:rgba(210,195,170,.045);
  }
  :root{
    --serif-display:'Cormorant Garamond', Georgia, serif;
    --serif-body:'EB Garamond', Georgia, serif;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:#0c0a08;}
  .site{
    background:var(--paper); color:var(--ink);
    font-family:var(--serif-body); min-height:100vh;
    -webkit-font-smoothing:antialiased;
    transition:background .5s ease, color .5s ease;
  }
  .view-fade{animation:fade .5s ease;}
  @keyframes fade{from{opacity:0;} to{opacity:1;}}

  /* ---------------- SHARED ---------------- */
  .frame{position:relative;overflow:hidden;background:var(--paper-2);}
  .frame img{width:100%;height:100%;object-fit:cover;display:block;}
  .frame--contain{background:transparent;}
  .frame--contain img{object-fit:contain;}
  .ph{background-color:var(--paper-deep);
    background-image:repeating-linear-gradient(45deg,transparent 0,transparent 11px,var(--ph-fill) 11px,var(--ph-fill) 12px);
    display:flex;align-items:center;justify-content:center;}
  .ph::after{content:"";position:absolute;inset:14px;border:1px solid var(--ph-stroke);}
  .ph-label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-faint);
    text-transform:lowercase;text-align:center;padding:0 12px;line-height:1.6;z-index:1;}
  .overline{font-family:var(--mono);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-soft);}
  .meta{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);}

  /* ---------------- THEME TOGGLE ---------------- */
  .theme-toggle{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:999px;padding:3px;width:max-content;}
  .theme-toggle button{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);background:none;border:0;cursor:pointer;padding:6px 14px;border-radius:999px;transition:.25s;}
  .theme-toggle button.is-on{background:var(--ink);color:var(--paper);}
  .theme-toggle .sep{width:0;}
  .theme-toggle--mini button{padding:5px 12px;font-size:9px;}

  /* ---------------- HOME (Sketchbook) ---------------- */
  .sketch{display:grid;grid-template-columns:330px 1fr;min-height:100vh;}
  .sketch .rail{border-right:1px solid var(--line);padding:60px 40px;display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;}
  .sketch .rail .mono-sm{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);}
  .sketch .rail h1{font-family:var(--serif-display);font-weight:500;font-size:56px;line-height:.96;margin:20px 0 0;letter-spacing:-.01em;}
  .sketch .rail .desc{font-size:17px;line-height:1.55;color:var(--ink-soft);margin-top:26px;max-width:230px;}
  .sketch .rail .navlist{margin-top:42px;display:flex;flex-direction:column;gap:14px;}
  .sketch .rail .navlist a{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);text-decoration:none;display:flex;gap:12px;width:max-content;padding-bottom:3px;border-bottom:1px solid transparent;transition:.2s;}
  .sketch .rail .navlist a:hover{border-bottom-color:var(--accent);}
  .sketch .rail .navlist a.is-active{border-bottom-color:var(--accent);}
  .sketch .rail .navlist a .num{color:var(--ink-faint);}
  .sketch .rail .rail-foot{margin-top:auto;padding-top:40px;display:flex;flex-direction:column;gap:22px;}
  .sketch .rail .sig{font-family:var(--serif-display);font-style:italic;font-size:19px;color:var(--ink-soft);}

  .sketch .body{padding:60px 64px 0;}
  .sketch .body .ctitle{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:48px;}
  .sketch .entries{display:flex;flex-direction:column;gap:30px;}
  .sketch .entry{display:grid;grid-template-columns:62px 1fr;gap:30px;cursor:pointer;padding:22px;margin:-22px;border-radius:3px;transition:background .25s;outline:none;}
  .sketch .entry:hover,.sketch .entry:focus-visible{background:var(--paper-2);}
  .sketch .entry:hover .e-frame img,.sketch .entry:focus-visible .e-frame img{transform:scale(1.03);}
  .sketch .entry .e-frame img{transition:transform .6s ease;}
  .sketch .entry:hover .e-view,.sketch .entry:focus-visible .e-view{opacity:1;transform:translateX(0);}
  .sketch .entry .idx{font-family:var(--serif-display);font-size:44px;color:var(--ink-faint);line-height:1;font-weight:400;}
  .sketch .entry .row{display:grid;grid-template-columns:1.25fr 1fr;gap:34px;align-items:start;}
  .sketch .entry .e-frame{width:100%;}
  .sketch .entry .e-text{padding-top:6px;}
  .sketch .entry .e-text .et{font-family:var(--serif-display);font-style:italic;font-weight:500;font-size:36px;line-height:1.02;margin:0;}
  .sketch .entry .e-text .em{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-soft);margin-top:14px;text-transform:uppercase;}
  .sketch .entry .e-text .en{font-size:18px;line-height:1.55;color:var(--ink-soft);margin-top:18px;}
  .sketch .entry .e-text .e-view{display:inline-block;margin-top:20px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);opacity:0;transform:translateX(-6px);transition:.3s;}
  .sketch .body-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:64px;padding:36px 0 40px;}

  /* ---------------- ABOUT ---------------- */
  .about .about-grid{display:grid;grid-template-columns:0.85fr 1fr;gap:60px;align-items:start;padding-bottom:60px;}
  .about .about-portrait{display:flex;flex-direction:column;gap:14px;position:sticky;top:60px;}
  .about .about-portrait .ap-frame{width:100%;}
  .about .about-portrait .ap-cap{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);}
  .about .about-text{padding-top:4px;max-width:520px;}
  .about .about-text .lede{font-family:var(--serif-display);font-style:italic;font-weight:500;font-size:34px;line-height:1.18;margin:0 0 26px;color:var(--ink);}
  .about .about-text p{font-size:19px;line-height:1.66;color:var(--ink-soft);margin:0 0 20px;}
  .about .about-facts{margin-top:38px;display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line);}
  .about .about-facts .r{display:flex;justify-content:space-between;gap:20px;padding:15px 0;border-bottom:1px solid var(--line-soft);}
  .about .about-facts .r span:first-child{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);align-self:center;}
  .about .about-facts .r span:last-child{font-size:18px;color:var(--ink);}
  .about .about-sig{display:inline-block;margin-top:34px;font-family:var(--serif-display);font-style:italic;font-size:21px;color:var(--ink-soft);}

  /* ---------------- DETAIL (Immersive) ---------------- */
  .d-immersive{display:grid;grid-template-columns:1.35fr 1fr;height:100vh;}
  .d-immersive .art-side{background:var(--paper-deep);display:flex;align-items:center;justify-content:center;padding:70px;}
  .d-immersive .art-side .art{height:100%;max-height:660px;aspect-ratio:3/4;box-shadow:0 30px 60px var(--art-shadow);}
  .d-immersive .meta-side{padding:46px 70px 54px;display:flex;flex-direction:column;}
  .d-immersive .meta-top{display:flex;justify-content:space-between;align-items:center;}
  .d-immersive .meta-top .back{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);background:none;border:0;cursor:pointer;padding:6px 0;}
  .d-immersive .meta-top .back:hover{color:var(--accent);}
  .d-immersive .meta-mid{margin:auto 0;}
  .d-immersive .meta-side h2{font-family:var(--serif-display);font-weight:500;font-size:78px;line-height:.92;margin:26px 0 0;}
  .d-immersive .meta-side .yr{font-family:var(--serif-display);font-style:italic;font-size:30px;color:var(--ink-soft);margin-top:8px;display:block;}
  .d-immersive .meta-side p{font-size:21px;line-height:1.6;color:var(--ink-soft);margin:30px 0 0;max-width:400px;}
  .d-immersive .meta-side .spec{margin-top:40px;display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:400px;}
  .d-immersive .meta-side .spec .c .meta{font-size:10px;display:block;}
  .d-immersive .meta-side .spec .c .v{font-family:var(--serif-display);font-size:25px;margin-top:6px;display:block;}
  .d-immersive .pager{display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--line);padding-top:26px;margin-top:30px;}
  .d-immersive .pager button{font-family:var(--serif-display);font-style:italic;font-size:21px;color:var(--ink-soft);background:none;border:0;cursor:pointer;text-align:left;}
  .d-immersive .pager button:last-child{text-align:right;}
  .d-immersive .pager button:hover{color:var(--accent);}

  /* ---------------- LOADING / ERROR ---------------- */
  .loading-state { display:flex; align-items:center; justify-content:center; min-height:100vh; font-family:var(--mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-soft); background:var(--paper); }
  .error-panel { padding:60px 64px; }
  .error-panel p { font-family:var(--serif-body); font-size:18px; color:var(--ink-soft); line-height:1.6; }

  /* ---------------- RESPONSIVE ---------------- */
  @media (max-width:980px){
    .sketch{grid-template-columns:1fr;}
    .sketch .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);}
    .sketch .rail h1{font-size:48px;}
    .sketch .entry .row{grid-template-columns:1fr;gap:20px;}
    .about .about-grid{grid-template-columns:1fr;gap:34px;}
    .about .about-portrait{position:static;}
    .d-immersive{grid-template-columns:1fr;height:auto;min-height:100vh;}
    .d-immersive .art-side{padding:48px;}
    .d-immersive .meta-side{padding:40px;}
    .d-immersive .meta-side h2{font-size:56px;}
  }
</style>
</head>
<body>
<div id="root"></div>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#e6ddcb"/>

    <path d="M42 60 q8 -22 16 0" fill="none" stroke="#6f6555" stroke-width="1.4"/>
    <circle cx="50" cy="42" r="7" fill="none" stroke="#6f6555" stroke-width="1.4"/>
    <text x="50" y="88" font-family="Georgia, serif" font-style="italic" font-size="9" fill="#2b2823" text-anchor="middle">Sketches</text>
  </svg>
</template>
